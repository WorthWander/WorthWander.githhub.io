<script>

document.addEventListener('DOMContentLoaded', function () {

    // LOAD SAVED DATA

    function loadData(key, fallback) {

        try {

            const saved = localStorage.getItem(key);

            return saved === null ? fallback : JSON.parse(saved);

        } catch {

            return fallback;

        }

    }

    let expenses = loadData('roam_expenses', []);

    if (!Array.isArray(expenses)) expenses = [];

    const savedName = localStorage.getItem('roam_trip_name');

    const savedBudget = localStorage.getItem('roam_budget_amt');

    // ELEMENTS

    const form = document.getElementById('expense-form');

    const nameInput = document.getElementById('exp-name');

    const categoryInput = document.getElementById('exp-category');

    const amountInput = document.getElementById('exp-amount');

    const budgetInput = document.getElementById('total-budget');

    const tripInput = document.getElementById('trip-name');

    // MONEY FORMAT

    function money(amount) {

        return '$' + amount.toLocaleString('en-US', {

            minimumFractionDigits: 2,

            maximumFractionDigits: 2

        });

    }

    // SAVE EXPENSES

    function saveExpenses() {

        localStorage.setItem(

            'roam_expenses',

            JSON.stringify(expenses)

        );

    }

    // UPDATE TRIP NAME

    function updateTripName() {

        const name = tripInput.value.trim();

        document.getElementById('display-trip-name').textContent =

            name ? name + ' Budget' : 'Trip Budget';

        localStorage.setItem('roam_trip_name', name);

    }

    // ADD EXPENSE

    form.addEventListener('submit', function (event) {

        event.preventDefault();

        event.stopPropagation();

        const name = nameInput.value.trim();

        const category = categoryInput.value;

        const amount = Number(amountInput.value);

        if (!name || !Number.isFinite(amount) || amount <= 0) {

            alert('Please enter a valid expense name and amount.');

            return;

        }

        const expense = {

            id: Date.now() + Math.random(),

            name: name,

            category: category,

            amount: amount

        };

        expenses.push(expense);

        saveExpenses();

        render();

        form.reset();

        nameInput.focus();

    });

    // DELETE EXPENSE

    function deleteExpense(id) {

        expenses = expenses.filter(expense => expense.id !== id);

        saveExpenses();

        render();

    }

    // BUDGET UPDATES

    budgetInput.addEventListener('input', render);

    // TRIP NAME UPDATES

    tripInput.addEventListener('input', updateTripName);

    // RENDER DASHBOARD

    function render() {

        const budget = Math.max(0, Number(budgetInput.value) || 0);

        localStorage.setItem('roam_budget_amt', budget);

        const totalSpent = expenses.reduce(

            (sum, expense) => sum + (Number(expense.amount) || 0),

            0

        );

        const remaining = budget - totalSpent;

        const percentUsed = budget > 0

            ? (totalSpent / budget) * 100

            : 0;

        // UPDATE STATISTICS

        document.getElementById('stat-budget').textContent =

            money(budget);

        document.getElementById('stat-spent').textContent =

            money(totalSpent);

        const remainingElement =

            document.getElementById('stat-remaining');

        remainingElement.textContent = money(remaining);

        // PROGRESS BAR

        const progressBar = document.getElementById('progress-bar');

        const budgetMessage = document.getElementById('budget-message');

        if (remaining < 0) {

            remainingElement.className =

                'text-xl md:text-2xl font-extrabold text-rose-600';

            progressBar.className = 'progress-fill bg-rose-500';

            budgetMessage.textContent =

                'You have exceeded your travel budget. Consider reviewing your expenses.';

        } else if (percentUsed >= 80) {

            remainingElement.className =

                'text-xl md:text-2xl font-extrabold text-amber-500';

            progressBar.className = 'progress-fill bg-amber-500';

            budgetMessage.textContent =

                "You're getting close to your budget limit. Keep an eye on spending!";

        } else {

            remainingElement.className =

                'text-xl md:text-2xl font-extrabold text-emerald-600';

            progressBar.className = 'progress-fill bg-indigo-600';

            budgetMessage.textContent = totalSpent === 0

                ? "You're ready to start planning your trip!"

                : "Looking good! You're staying within your budget.";

        }

        document.getElementById('progress-text').textContent =

            Math.round(percentUsed) + '%';

        progressBar.style.width =

            Math.min(percentUsed, 100) + '%';

        // EXPENSE BREAKDOWN

        const tbody = document.getElementById('expense-rows');

        tbody.replaceChildren();

        if (expenses.length === 0) {

            const row = document.createElement('tr');

            const cell = document.createElement('td');

            cell.colSpan = 4;

            cell.className = 'text-center py-12 text-slate-400';

            cell.textContent =

                '✈️ No expenses yet. Add your first travel expense above!';

            row.appendChild(cell);

            tbody.appendChild(row);

            return;

        }

        expenses.forEach(expense => {

            const row = document.createElement('tr');

            row.className =

                'expense-row border-b border-slate-50 transition-colors';

            // EXPENSE NAME

            const nameCell = document.createElement('td');

            nameCell.className =

                'py-4 px-3 font-semibold text-slate-700';

            nameCell.textContent = expense.name;

            // CATEGORY

            const categoryCell = document.createElement('td');

            const categoryBadge = document.createElement('span');

            categoryCell.className = 'py-4 px-3';

            categoryBadge.className =

                'inline-block px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 text-xs font-semibold whitespace-nowrap';

            categoryBadge.textContent = expense.category;

            categoryCell.appendChild(categoryBadge);

            // AMOUNT

            const amountCell = document.createElement('td');

            amountCell.className =

                'py-4 px-3 text-right font-bold text-slate-800 whitespace-nowrap';

            amountCell.textContent =

                money(Number(expense.amount) || 0);

            // REMOVE BUTTON

            const actionCell = document.createElement('td');

            const deleteButton = document.createElement('button');

            actionCell.className = 'py-4 px-3 text-center';

            deleteButton.type = 'button';

            deleteButton.textContent = 'Remove';

            deleteButton.className =

                'text-rose-500 hover:text-rose-700 font-semibold text-xs transition-colors';

            deleteButton.addEventListener('click', function () {

                deleteExpense(expense.id);

            });

            actionCell.appendChild(deleteButton);

            row.append(

                nameCell,

                categoryCell,

                amountCell,

                actionCell

            );

            tbody.appendChild(row);

        });

    }

    // RESTORE SETTINGS

    tripInput.value = savedName || 'My Dream Vacation';

    budgetInput.value =

        savedBudget !== null ? savedBudget : '1500';

    // INITIALIZE

    updateTripName();

    render();

});

</script>
