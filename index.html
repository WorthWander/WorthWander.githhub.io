<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Travel Planner</title>
    <!-- FIXED: Tailwind CSS script link now works perfectly -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-3xl font-black text-indigo-600 tracking-tight">✈️ RoamBudget</h1>
            <p class="text-slate-500">Plan your trip, protect your wallet.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Left Column: Inputs -->
            <div class="md:col-span-1 space-y-6">
                <!-- Trip Setup Card -->
                <div class="bg-white p-5 rounded-2xl shadow-xs border border-slate-100">
                    <h2 class="font-bold text-lg mb-4 text-slate-700">1. Trip Settings</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Destination</label>
                            <input id="trip-name" type="text" value="My Dream Vacation" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-indigo-500" oninput="updateTripName()">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Total Budget ($)</label>
                            <input id="total-budget" type="number" value="1500" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-indigo-500" oninput="render()">
                        </div>
                    </div>
                </div>

                <!-- Add Expense Card -->
                <div class="bg-white p-5 rounded-2xl shadow-xs border border-slate-100">
                    <h2 class="font-bold text-lg mb-4 text-slate-700">2. Add Expense</h2>
                    <form id="expense-form" class="space-y-3" onsubmit="addExpense(event)">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Item Name</label>
                            <input id="exp-name" type="text" placeholder="e.g., Hotel, Flight" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Category</label>
                            <select id="exp-category" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-indigo-500">
                                <option value="🛏️ Stay">🛏️ Stay</option>
                                <option value="🚗 Transit">🚗 Transit</option>
                                <option value="🍔 Food">🍔 Food</option>
                                <option value="🎟️ Fun">🎟️ Fun</option>
                                <option value="📦 Other">📦 Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Cost ($)</label>
                            <input id="exp-amount" type="number" placeholder="0.00" required min="0.01" step="0.01" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition-colors cursor-pointer">
                            Add to Trip
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Dashboard & Tracker -->
            <div class="md:col-span-2 space-y-6">
                <!-- Financial Summary Dashboard -->
                <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-100">
                    <h2 id="display-trip-name" class="font-black text-xl text-slate-800 mb-4">My Dream Vacation Budget</h2>
                    
                    <div class="grid grid-cols-3 gap-4 text-center mb-6">
                        <div class="bg-slate-50 p-3 rounded-xl">
                            <span class="block text-xs text-slate-500 font-medium">Budget</span>
                            <span id="stat-budget" class="text-lg font-bold text-slate-700">$0.00</span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl">
                            <span class="block text-xs text-slate-500 font-medium">Spent</span>
                            <span id="stat-spent" class="text-lg font-bold text-slate-700">$0.00</span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl">
                            <span class="block text-xs text-slate-500 font-medium">Remaining</span>
                            <span id="stat-remaining" class="text-lg font-bold">$0.00</span>
                        </div>
                    </div>

                    <!-- Visual Progress Bar -->
                    <div>
                        <div class="flex justify-between text-xs font-semibold text-slate-500 mb-1">
                            <span>Budget Used</span>
                            <span id="progress-text">0%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                            <div id="progress-bar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Expense Break Down List -->
                <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-100">
                    <h3 class="font-bold text-slate-700 mb-3">Expense Breakdown</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-600">
                            <thead>
                                <tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase">
                                    <th class="py-2">Item</th>
                                    <th class="py-2">Category</th>
                                    <th class="py-2 text-right">Cost</th>
                                    <th class="py-2 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="expense-rows" class="divide-y divide-slate-50">
                                <!-- Appended dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // Load data from localStorage or fallback to defaults
        let expenses = JSON.parse(localStorage.getItem('roam_expenses')) || [];

        function updateTripName() {
            const name = document.getElementById('trip-name').value;
            document.getElementById('display-trip-name').textContent = name ? `${name} Budget` : 'Trip Budget';
            localStorage.setItem('roam_trip_name', name);
        }

        function addExpense(e) {
            e.preventDefault();
            const nameInput = document.getElementById('exp-name');
            const catInput = document.getElementById('exp-category');
            const amtInput = document.getElementById('exp-amount');

            const item = {
                id: Date.now(),
                name: nameInput.value,
                category: catInput.value,
                amount: parseFloat(amtInput.value)
            };

            expenses.push(item);
            saveData();
            render();
            
            // Reset form input values
            nameInput.value = '';
            amtInput.value = '';
        }

        function deleteExpense(id) {
            expenses = expenses.filter(exp => exp.id !== id);
            saveData();
            render();
        }

        function saveData() {
            localStorage.setItem('roam_expenses', JSON.stringify(expenses));
        }

        function render() {
            const budgetInput = document.getElementById('total-budget');
            const budget = parseFloat(budgetInput.value) || 0;
            localStorage.setItem('roam_budget_amt', budget);

            // Compute totals
            const totalSpent = expenses.reduce((sum, item) => sum + item.amount, 0);
            const remaining = budget - totalSpent;
            const percentUsed = budget > 0 ? Math.min((totalSpent / budget) * 100, 100) : 0;

            // Update Statistics 
            document.getElementById('stat-budget').textContent = `$${budget.toFixed(2)}`;
            document.getElementById('stat-spent').textContent = `$${totalSpent.toFixed(2)}`;
            
            const remainingElement = document.getElementById('stat-remaining');
            remainingElement.textContent = `$${remaining.toFixed(2)}`;
            
            // Budget alert color coding logic
            if (remaining < 0) {
                remainingElement.className = "text-lg font-bold text-rose-600";
                document.getElementById('progress-bar').className = "bg-rose-500 h-full transition-all duration-300";
                remainingElement.className = "text-lg font-bold text-amber-500";
                document.getElementById('progress-bar').className = "bg-amber-500 h-full transition-all duration-300";
            } else {
                remainingElement.className = "text-lg font-bold text-emerald-600";
                document.getElementById('progress-bar').className = "bg-indigo-600 h-full transition-all duration-300";
            }

            // Update Progress UI
            document.getElementById('progress-text').textContent = `${Math.round(percentUsed)}%`;
            document.getElementById('progress-bar').style.width = `${percentUsed}%`;

            // Render Table Rows
            const tbody = document.getElementById('expense-rows');
            tbody.innerHTML = '';

            if (expenses.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-400 text-xs">No expenses added yet. Add items to see them here!</td></tr>`;
                return;
            }

            expenses.forEach(exp => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-3 font-medium text-slate-800">${exp.name}</td>
                    <td class="py-3"><span class="px-2 py-1 bg-slate-100 rounded-md text-xs font-medium text-slate-600">${exp.category}</span></td>
                    <td class="py-3 text-right font-mono font-semibold">${exp.amount.toFixed(2)}</td>
                    <td class="py-3 text-center">
                        <button onclick="deleteExpense(${exp.id})" class="text-rose-500 hover:text-rose-700 text-xs font-semibold cursor-pointer">Remove</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Initialize state on app mount
        document.getElementById('trip-name').value = localStorage.getItem('roam_trip_name') || "My Dream Vacation";
        document.getElementById('total-budget').value = localStorage.getItem('roam_budget_amt') || "1500";
        updateTripName();
        render();
    </script>
</body>
</html>
